name: E2E Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test-e2e:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Create Kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          cluster_name: kind

      - name: Wait for Kind cluster to be ready
        run: |
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
          kubectl wait --for=condition=Ready --namespace=kube-system pod --all --timeout=300s
          echo "Cluster is ready"

      - name: Run E2E tests
        run: make test-e2e-ci

  test-e2e-olm-upgrade:
    name: Test OLM Upgrade
    runs-on: ubuntu-latest
    env:
      CONTAINER_TOOL: podman
      IMG: ghcr.io/sigstore/model-validation-operator:dev-${{ github.sha }}
      AGENT_IMG: ghcr.io/sigstore/model-validation-operator-agent:dev-${{ github.sha }}
      BUNDLE_IMG: ghcr.io/sigstore/model-validation-operator-bundle:dev-${{ github.sha }}
      CATALOG_IMG: ghcr.io/sigstore/model-validation-operator-catalog:dev-${{ github.sha }}
      BASE_IMG: ghcr.io/sigstore/model-validation-operator:olm-base-${{ github.sha }}
      BASE_AGENT_IMG: ghcr.io/sigstore/model-validation-operator-agent:olm-base-${{ github.sha }}
      BASE_BUNDLE_IMG: ghcr.io/sigstore/model-validation-operator-bundle:olm-base-${{ github.sha }}
      BASE_CATALOG_IMG: ghcr.io/sigstore/model-validation-operator-catalog:olm-base-${{ github.sha }}
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@def8c394e3ad351a79bc93815e4a585520fe993b # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Compute OLM upgrade versions
        run: |
          CURRENT=$(grep '^VERSION ?=' Makefile | cut -d= -f2 | tr -d ' ')
          NEXT=$(echo "$CURRENT" | awk -F. '{print $1"."$2"."$3+1}')
          echo "OLM_BASE_VERSION=$CURRENT" >> "$GITHUB_ENV"
          echo "OLM_UPGRADE_VERSION=$NEXT" >> "$GITHUB_ENV"

      - name: Build base operator image
        run: make docker-build docker-build-agent IMG=${{ env.BASE_IMG }} AGENT_IMG=${{ env.BASE_AGENT_IMG }}

      - name: Build target operator image
        run: make docker-build docker-build-agent IMG=${{ env.IMG }} AGENT_IMG=${{ env.AGENT_IMG }}

      - name: Build base bundle
        run: make bundle bundle-build IMG=${{ env.BASE_IMG }} AGENT_IMG=${{ env.BASE_AGENT_IMG }} BUNDLE_IMG=${{ env.BASE_BUNDLE_IMG }} VERSION=$OLM_BASE_VERSION CHANNELS=tech-preview DEFAULT_CHANNEL=tech-preview

      - name: Build target bundle
        run: make bundle bundle-build IMG=${{ env.IMG }} AGENT_IMG=${{ env.AGENT_IMG }} BUNDLE_IMG=${{ env.BUNDLE_IMG }} VERSION=$OLM_UPGRADE_VERSION CHANNELS=tech-preview DEFAULT_CHANNEL=tech-preview

      - name: Build base and target catalogs
        run: |
          make opm
          make catalog-build CATALOG_IMG=${{ env.BASE_CATALOG_IMG }} BUNDLE_IMGS=${{ env.BASE_BUNDLE_IMG }}
          make catalog-build CATALOG_IMG=${{ env.CATALOG_IMG }} BUNDLE_IMGS=${{ env.BUNDLE_IMG }} CATALOG_BASE_IMG=${{ env.BASE_CATALOG_IMG }}

      - name: Create Kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          cluster_name: kind

      - name: Wait for Kind cluster to be ready
        run: |
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
          kubectl wait --for=condition=Ready --namespace=kube-system pod --all --timeout=300s
          echo "Cluster is ready"

      - name: Load OLM test images into Kind
        run: |
          podman save ${{ env.BASE_IMG }} -o base-operator-oci.tar
          podman save ${{ env.BASE_AGENT_IMG }} -o base-agent-oci.tar
          podman save ${{ env.IMG }} -o target-operator-oci.tar
          podman save ${{ env.AGENT_IMG }} -o target-agent-oci.tar
          podman save ${{ env.BASE_BUNDLE_IMG }} -o base-bundle-oci.tar
          podman save ${{ env.BUNDLE_IMG }} -o target-bundle-oci.tar
          podman save ${{ env.BASE_CATALOG_IMG }} -o base-catalog-oci.tar
          podman save ${{ env.CATALOG_IMG }} -o target-catalog-oci.tar

          kind load image-archive base-operator-oci.tar
          kind load image-archive base-agent-oci.tar
          kind load image-archive target-operator-oci.tar
          kind load image-archive target-agent-oci.tar
          kind load image-archive base-bundle-oci.tar
          kind load image-archive target-bundle-oci.tar
          kind load image-archive base-catalog-oci.tar
          kind load image-archive target-catalog-oci.tar

      - name: Install OLM
        run: make e2e-install-olm

      - name: Setup OLM test namespaces
        run: make e2e-setup-namespaces

      - name: Run OLM upgrade tests
        env:
          TEST_BASE_CATALOG: ${{ env.BASE_CATALOG_IMG }}
          TEST_TARGET_CATALOG: ${{ env.CATALOG_IMG }}
        run: go test ./test/e2e-olm/ -v -ginkgo.v -timeout 20m
